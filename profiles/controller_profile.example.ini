[DreamcastRecompController]
version=2
# auto = XInput first, then native DirectInput/WinMM (recommended)
# ps4  = force native DualShock 4 / DirectInput without DS4Windows
# xinput = Xbox/DS4Windows/Steam Input style controller
# winmm = generic legacy DirectInput/WinMM device
backend=auto
device=0
deadzone=0.18

# Backend-neutral logical bindings. They adapt automatically to XInput or DS4 DirectInput.
a=logical:a
b=logical:b
x=logical:x
y=logical:y
start=logical:start
up=logical:up
down=logical:down
left=logical:left
right=logical:right
c=logical:c
z=logical:z
joy_x=logical:joy_x
joy_y=logical:joy_y
joy2_x=logical:joy2_x
joy2_y=logical:joy2_y
ltrig=logical:ltrig
rtrig=logical:rtrig
