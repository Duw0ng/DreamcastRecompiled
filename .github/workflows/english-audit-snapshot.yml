name: English content audit snapshot
on:
  push:
    branches: [english-first-github-content-v1.2]
    paths:
      - '.github/workflows/english-audit-snapshot.yml'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Pack tracked text sources only
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          allowed={'.md','.txt','.yml','.yaml','.go','.py','.cpp','.hpp','.h','.c','.bat','.cmd','.ps1','.js','.ts','.html','.css','.json','.toml','.xml','.rst','.ini','.cfg','.sh'}
          paths=[]
          for name in subprocess.check_output(['git','ls-files','-z']).decode('utf8').split('\0'):
              if not name: continue
              p=pathlib.Path(name)
              if p.suffix.lower() not in allowed and p.name not in {'README','LICENSE','Dockerfile'}: continue
              if not p.is_file() or p.stat().st_size>1000000: continue
              try: p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,ValueError): continue
              paths.append(str(p))
          with tarfile.open('repo-text-audit.tar.gz','w:gz') as f:
              for p in paths: f.add(p)
          print('Auditable text files:',len(paths))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dcr-repository-english-audit-snapshot
          path: repo-text-audit.tar.gz
          if-no-files-found: error
          retention-days: 3
