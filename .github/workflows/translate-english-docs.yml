name: Translate historical Spanish GitHub documentation to English
on:
  push:
    branches: [english-first-github-content-v1.2]
    paths:
      - '.github/workflows/translate-english-docs.yml'
  workflow_dispatch:
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install local Spanish-English model
        run: |
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q 'transformers==4.44.2' sentencepiece sacremoses
      - name: Translate prose while protecting source, code blocks and Markdown links
        run: |
          python tools/translate_github_docs.py --out english-translation-output
      - uses: actions/upload-artifact@v4
        with:
          name: dcr-english-docs-review
          path: |
            english-translation-output/translated-docs.tar.gz
            english-translation-output/translated-docs-report.json
          if-no-files-found: error
          retention-days: 7
