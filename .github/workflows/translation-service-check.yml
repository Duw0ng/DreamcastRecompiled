name: Check automatic English translation service
on:
  push:
    branches: [english-first-github-content-v1.2]
    paths:
      - '.github/workflows/translation-service-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public translation endpoint availability
        run: |
          python -m pip install -q deep-translator
          python - <<'PY'
          from deep_translator import GoogleTranslator
          source='La corrección evita repetir sonidos al cambiar opciones del menú. Se conservan los 32 KiB de IP.BIN.'
          print('SOURCE:',source)
          print('ENGLISH:',GoogleTranslator(source='es',target='en').translate(source))
          PY
