name: Publish direct game binary releases
on:
  push:
    branches: [main]
    paths:
      - 'game-portables/binary-sources/*.json'
      - 'game-portables/tools/assemble_blob_portable.py'
      - '.github/workflows/publish-direct-binaries.yml'
      - 'game-portables/release-notes/*.md'
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Optional SEGA_TETRIS or SGGG; empty publishes all unpublished'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: dcr-game-portable-binary-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Duw0ng/DreamcastRecompiled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify original Windows ZIPs and publish releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_GAME: ${{ inputs.game_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for manifest in game-portables/binary-sources/*.json; do
            game_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["game_id"])' "$manifest")"
            if [[ -n "${SELECTED_GAME:-}" && "$game_id" != "$SELECTED_GAME" ]]; then continue; fi
            release_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_tag"])' "$manifest")"
            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Already published: $release_tag"
              continue
            fi
            case "$game_id" in
              SEGA_TETRIS) notes='game-portables/release-notes/SEGA_TETRIS.md' ;;
              SGGG) notes='game-portables/release-notes/SGGG.md' ;;
              *) echo "Unknown game ID: $game_id" >&2; exit 2 ;;
            esac
            python3 game-portables/tools/assemble_blob_portable.py --manifest "$manifest" --output dist --repo "$GITHUB_REPOSITORY"
            asset="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset"])' "$manifest")"
            title="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$manifest")"
            (cd dist && sha256sum --check "$asset.sha256")
            gh release create "$release_tag" "dist/$asset" "dist/$asset.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DreamcastRecompiled — $title Direct Portable V1.2" \
              --notes-file "$notes" --latest=false
          done
