name: Build DroidDeck A56 Xclipse TAR fix
run-name: A56 Xclipse test APK on ${{ github.sha }}
on:
  push:
    branches:
      - ci/droiddeck-a56-xclipse-pathfix-20261018
permissions:
  contents: read
env:
  PRELOAD_CACHE_VERSION: v6
  DROIDDECK_COMPONENT_REPOSITORY: wallentx/DroidDeck
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      variants: ${{ steps.variants.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wallentx/DroidDeck
          ref: 2eec15a54924a996a50380cafd7af7ecd26c5e48
          persist-credentials: false
          fetch-depth: 0

      - name: Check co-authors
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base=$(git merge-base origin/main HEAD)
          messages=$(git log --format=%B "$base..HEAD")
          messages+=$'\n'"$(jq -r '.pull_request.title, (.pull_request.body // "")' "$GITHUB_EVENT_PATH")"
          if grep -Eiq '^[[:space:]]*Co-authored-by:.*(Claude|Anthropic|OpenAI|ChatGPT|GPT|Copilot|Cursor|Gemini|Codex|Devin|Windsurf|Codeium|Amazon Q|Tabnine|Cody|\[bot\])' <<<"$messages"; then
            echo "::error::AI and bot identities cannot be co-authors; remove the Co-authored-by trailer."
            exit 1
          fi

      - name: The packages a signed build ships as
        id: variants
        run: echo "list=$(awk '!/^#/ && NF { print $1 }' tools/release/variants.txt | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      - name: No private key in the tree
        run: |
          set -euo pipefail
          keys=$(git ls-files | grep -iE '\.(jks|keystore|p12|pfx|pk8|pem|key)$' | grep -vx 'keystore/testkey.p12' || true)
          if [ -n "$keys" ]; then
            echo "::error::a private key is committed - remove it from the history and make a new one: $keys"
            exit 1
          fi

      - name: Version bumps are isolated
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base=$(git merge-base origin/main HEAD)
          diff=$(git diff -U0 "$base..HEAD" -- app/build.gradle)
          grep -Eq '^[+-][[:space:]]*version(Code|Name)[[:space:]]' <<<"$diff" || exit 0
          other_files=$(git diff --name-only "$base..HEAD" | grep -v '^app/build.gradle$' || true)
          other_gradle=$(grep -E '^[+-]' <<<"$diff" | grep -Ev '^(---|\+\+\+)' | grep -Ev '^[+-][[:space:]]*version(Code|Name)[[:space:]]' || true)
          if [[ -n "$other_files" || -n "$other_gradle" ]]; then
            echo "::error::versionCode/versionName changes must be isolated in their own PR"
            echo "A version PR may only change the versionCode/versionName lines in app/build.gradle." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Merge onto main, or say what conflicts
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --no-tags origin main
          BASE=$(git rev-parse --short origin/main)
          HEAD=$(git rev-parse --short HEAD)
          if git merge --no-ff --no-edit origin/main >/tmp/merge.out 2>&1; then
            {
              echo "###  Mergeable"
              echo
              echo "\`$HEAD\` merges cleanly onto main (\`$BASE\`). What follows was built from the merged result."
            } > /tmp/pr-merge.md
            cat /tmp/pr-merge.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=U)
          if [ -z "$FILES" ]; then
            {
              echo "### ERROR: Could not merge onto main (\`$BASE\`)"
              echo
              echo '```'
              cat /tmp/merge.out
              echo '```'
            } > /tmp/pr-merge.md
            cat /tmp/pr-merge.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error::git could not merge main: $(head -3 /tmp/merge.out | tr '\n' ' ')"
            exit 1
          fi
          {
            echo "### ERROR: Not mergeable - conflicts with main (\`$BASE\`)"
            echo
            echo "Files that conflict:"
            echo
            for f in $FILES; do echo "- \`$f\`"; done
            echo
            echo "Each conflicting hunk, as git leaves it: \`<<<<<<< HEAD\` is this pull request, \`>>>>>>> origin/main\` is main."
            echo
            for f in $FILES; do
              echo "<details><summary><code>$f</code></summary>"
              echo
              echo '```'
              awk '/^<<<<<<< /{p=1} p{print} /^>>>>>>> /{p=0}' "$f" | head -300
              echo '```'
              echo "</details>"
              echo
            done
            echo "Not built: rebase or merge main into the branch and push again."
          } > /tmp/pr-merge.md
          cat /tmp/pr-merge.md >> "$GITHUB_STEP_SUMMARY"
          git merge --abort || true
          echo "::error::the pull request conflicts with main: $(echo $FILES | tr '\n' ' ')"
          exit 1

      - name: Apply A56 Xclipse TAR directory fix and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/com/droiddeck/launcher/gpu')
          store = root / 'SystemVulkanComponentStore.kt'
          content = store.read_text(encoding='utf-8')
          old = 'val path = SystemVulkanManifest.path(entry.name)'
          new = 'val path = SystemVulkanManifest.archiveEntryPath(entry.name, entry.isDirectory)'
          assert content.count(old) == 1, 'unexpected TAR reader; aborting'
          store.write_text(content.replace(old, new), encoding='utf-8')
          manifest = root / 'SystemVulkanManifest.kt'
          content = manifest.read_text(encoding='utf-8')
          anchor = '    private val COMMON_REQUIRED = setOf('
          addition = '''    // Normalize a TAR directory's one trailing separator; never weaken file validation.
              fun archiveEntryPath(value: String, isDirectory: Boolean): String =
                  path(if (isDirectory && value.endsWith('/')) value.dropLast(1) else value)
          
          '''
          assert content.count(anchor) == 1 and 'fun archiveEntryPath(' not in content, 'unexpected manifest layout'
          manifest.write_text(content.replace(anchor, addition + anchor), encoding='utf-8')
          tests = Path('app/src/test/java/com/droiddeck/launcher/gpu/SystemVulkanManifestTest.kt')
          content = tests.read_text(encoding='utf-8')
          anchor = '    @Test fun sidecarBindsProducerArtifactAndRequirements() {'
          addition = '''    @Test fun tarDirectoryNamesAreNormalizedWithoutWeakeningFilePaths() {
                  assertEquals("lib", SystemVulkanManifest.archiveEntryPath("lib/", true))
                  assertEquals("lib", SystemVulkanManifest.archiveEntryPath("lib", true))
                  assertEquals("lib/libhybris", SystemVulkanManifest.archiveEntryPath("lib/libhybris/", true))
                  assertEquals("lib/a.so", SystemVulkanManifest.archiveEntryPath("lib/a.so", false))
                  for (unsafe in listOf("../", "/tmp/", "lib//", "lib/./", "lib/../", "/")) {
                      assertTrue("reject $unsafe", runCatching { SystemVulkanManifest.archiveEntryPath(unsafe, true) }.isFailure)
                  }
                  assertTrue(runCatching { SystemVulkanManifest.archiveEntryPath("lib/", false) }.isFailure)
              }
          
          '''
          assert content.count(anchor) == 1 and 'tarDirectoryNamesAreNormalizedWithoutWeakeningFilePaths' not in content
          tests.write_text(content.replace(anchor, addition + anchor), encoding='utf-8')
          print('Xclipse TAR directory fix applied')
          PY
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Resolve the runner's NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          VERSION=$(sed -n 's/^Pkg.Revision *= *//p' "$NDK/source.properties")
          echo "NDK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set the APK build label
        id: build-label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            tree_state=dirty
          else
            tree_state=clean
          fi
          echo "DROIDDECK_BUILD_TREE_STATE=$tree_state" >> "$GITHUB_ENV"
          if [[ -n "$PR_NUMBER" ]]; then
            label="pr${PR_NUMBER} at ${PR_HEAD_SHA:0:7}"
          else
            label="${BUILD_REF} at ${BUILD_SHA:0:7}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "DROIDDECK_SOURCE_COMMIT=${PR_HEAD_SHA:-$BUILD_SHA}" >> "$GITHUB_ENV"
          echo "DROIDDECK_PR_NUMBER=${PR_NUMBER:-0}" >> "$GITHUB_ENV"
          echo "Build: \`$label\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache the preloads
        id: preloads
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/linuxfs
          key: preloads-${{ env.PRELOAD_CACHE_VERSION }}-${{ hashFiles('app/src/main/cpp/fakeinput_steam.cpp', 'app/src/main/cpp/adrenotools/src/hook/kgsl.h', 'tools/quest/*', 'tools/linuxfs/preload/*.c', 'tools/linuxfs/build-x86-preloads.sh', 'tools/linuxfs/fex/*', 'tools/linuxfs/clipboard/*.c', 'tools/linuxfs/ssbs/*.c', 'tools/proot/fastpath/*.c', 'tools/linuxfs/overlay/usr/local/bin/*', 'tools/linuxfs/overlay/usr/bin/**', 'tools/linuxfs/desktop/*', 'tools/gamescope/release.env', 'tools/wlroots/release.env', 'tools/linuxfs/uruntime.env', 'tools/linuxfs/licenses/*', 'tools/mangoapp/*', 'tools/msitools/**', 'tools/comet/**', 'tools/linuxfs/debian-image.env', 'tools/vr/**') }}

      - name: Build libfakeinput.so and libblsession.so (glibc aarch64)
        if: steps.preloads.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libvulkan-dev libvulkan1 mesa-vulkan-drivers >/dev/null
          D=app/src/main/assets/linuxfs
          mkdir -p "$D"
          aarch64-linux-gnu-g++ -shared -fPIC -O2 -Wall -Wno-attributes -Wno-nonnull-compare \
            -pthread -std=c++17 -static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL \
            -o "$D/libfakeinput.so" app/src/main/cpp/fakeinput_steam.cpp -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libfakeinput.so"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o "$D/libblsession.so" tools/linuxfs/preload/*.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libblsession.so"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o "$D/libblfastpath.so" tools/proot/fastpath/fastpath.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libblfastpath.so"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -nostdlib -ffreestanding -fno-stack-protector \
            -fno-tree-loop-distribute-patterns -Wl,-z,defs -o "$D/libblaudit.so" tools/proot/fastpath/audit.c
          aarch64-linux-gnu-strip --strip-unneeded "$D/libblaudit.so"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread \
            -o "$D/libssbs.so" tools/linuxfs/ssbs/ssbs_adapter.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libssbs.so"
          mkdir -p "$D/usr/local/bin"
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -o "$D/usr/local/bin/droiddeck-clipboard" tools/linuxfs/clipboard/clipboard.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/usr/local/bin/droiddeck-clipboard"
          VK_INCLUDE=$(ls -d "${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"/toolchains/llvm/prebuilt/*/sysroot/usr/include | head -1) \
            tools/vr/build.sh --native "$D/usr/local/lib/droiddeck-vr"
          for script in tools/linuxfs/overlay/usr/local/bin/droiddeck-* tools/linuxfs/overlay/usr/local/bin/steam-compatibility; do
            install -Dm644 "$script" "$D/usr/local/bin/$(basename "$script")"
          done
          for f in tools/linuxfs/overlay/usr/bin/* tools/linuxfs/overlay/usr/bin/steamos-polkit-helpers/*; do
            [ -f "$f" ] && install -Dm644 "$f" "$D/${f#tools/linuxfs/overlay/}"
          done
          if [ -f tools/gamescope/release.env ]; then
            . tools/gamescope/release.env
            gh release download "${GAMESCOPE_TAG}" -R "${GAMESCOPE_REPO:-${GITHUB_REPOSITORY}}" -p gamescope.tzst -O gamescope.tzst
            echo "${GAMESCOPE_SHA256}  gamescope.tzst" | sha256sum -c -
            tar --use-compress-program=unzstd -xf gamescope.tzst -C "$D"
            test -f "$D/usr/local/bin/gamescope"
            rm gamescope.tzst
          fi
          . tools/linuxfs/uruntime.env
          curl -fsSL --retry 3 -o uruntime "https://github.com/VHSgunzo/uruntime/releases/download/${URUNTIME_VERSION}/${URUNTIME_ASSET}"
          echo "${URUNTIME_SHA256}  uruntime" | sha256sum -c -
          install -Dm644 uruntime "$D/usr/local/lib/droiddeck/uruntime"
          install -Dm644 tools/linuxfs/licenses/uruntime-LICENSE "$D/usr/local/share/licenses/uruntime/LICENSE"
          rm uruntime
          M="$D/usr/local/lib/mangoapp"
          mkdir -p "$M" mango-pkgs
          grep -v '^#' tools/mangoapp/packages.txt | while read -r sum url; do
            [ -n "$url" ] || continue
            curl -fsSL --retry 3 -o mango-pkgs/pkg.tar.zst "$url"
            echo "$sum  mango-pkgs/pkg.tar.zst" | sha256sum -c -
            tar --use-compress-program=unzstd -xf mango-pkgs/pkg.tar.zst -C mango-pkgs
            rm mango-pkgs/pkg.tar.zst
          done
          install -m644 mango-pkgs/usr/bin/mangoapp "$M/mangoapp"
          for so in libfmt.so.10 libspdlog.so.1.13 libglfw.so.3 libtraceevent.so.1; do
            cp -L "mango-pkgs/usr/lib/$so" "$M/$so"
          done
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -Wl,-soname,libtracefs.so.1 \
            -o "$M/libtracefs.so.1" tools/mangoapp/libtracefs-shim.c
          aarch64-linux-gnu-strip --strip-unneeded "$M/libtracefs.so.1"
          install -Dm644 tools/mangoapp/mangoapp "$D/usr/local/bin/mangoapp"
          rm -rf mango-pkgs
          ls -l "$M"
          T="$D/usr/local/lib/droiddeck-msitools"
          mkdir -p "$T" msi-pkgs
          grep -v '^#' tools/msitools/packages.txt | while read -r sum url; do
            [ -n "$url" ] || continue
            curl -fsSL --retry 3 -o msi-pkgs/pkg.tar.xz "$url"
            echo "$sum  msi-pkgs/pkg.tar.xz" | sha256sum -c -
            tar -xJf msi-pkgs/pkg.tar.xz -C msi-pkgs
            rm msi-pkgs/pkg.tar.xz
          done
          install -m644 msi-pkgs/usr/bin/msiinfo "$T/msiinfo"
          install -m644 msi-pkgs/usr/bin/cabextract "$T/cabextract"
          install -m644 msi-pkgs/usr/lib/7zip/7z "$T/7z"
          install -m644 msi-pkgs/usr/lib/7zip/7z.so "$T/7z.so"
          for so in libmsi-1.0.so.0 libgsf-1.so.114 libgcab-1.0.so.0; do
            cp -L "msi-pkgs/usr/lib/$so" "$T/$so"
          done
          for f in NOTICE GPL-2 GPL-3 LGPL-2.1 7zip-License 7zip-unRarLicense; do
            install -Dm644 "tools/msitools/licenses/$f" "$D/usr/local/share/licenses/droiddeck-msitools/$f"
          done
          rm -rf msi-pkgs
          ls -l "$T"
          install -Dm644 tools/linuxfs/desktop/droiddeck-desktop "$D/usr/local/bin/droiddeck-desktop"
          install -Dm644 tools/linuxfs/desktop/droiddeck-gpu "$D/usr/local/bin/droiddeck-gpu"
          install -Dm644 tools/linuxfs/desktop/droiddeck-desktop-gpu "$D/usr/local/bin/droiddeck-desktop-gpu"
          install -Dm644 tools/linuxfs/desktop/kwin_wayland_wrapper "$D/usr/local/bin/kwin_wayland_wrapper"
          install -Dm644 tools/linuxfs/desktop/firefox-droiddeck.js "$D/usr/lib/firefox/defaults/pref/droiddeck.js"
          ls -lR "$D"

      - name: Fetch the Debian image the preloads build in
        if: steps.preloads.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . tools/linuxfs/debian-image.env
          image=public.ecr.aws/docker/library/debian:bullseye
          if gh release download "$DEBIAN_IMAGE_TAG" -R "${DEBIAN_IMAGE_REPO:-${GITHUB_REPOSITORY}}" -p "$DEBIAN_IMAGE_ASSET" -O /tmp/debian-image.tar.zst \
             && { [ -z "$DEBIAN_IMAGE_SHA256" ] || echo "$DEBIAN_IMAGE_SHA256  /tmp/debian-image.tar.zst" | sha256sum -c -; }; then
            zstd -dc /tmp/debian-image.tar.zst | docker load
            rm -f /tmp/debian-image.tar.zst
          else
            echo "::warning::the hosted Debian image could not be fetched; pulling from the registry instead"
            for attempt in 1 2 3 4 5; do
              docker pull "$image" && break
              [ "$attempt" -lt 5 ] || { echo "::error::could not pull $image after $attempt attempts"; exit 1; }
              echo "pull attempt $attempt failed (registry busy?); retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            done
          fi
          docker image ls "$image"

      - name: Build the x86 preloads FEX guests load (glibc 2.31)
        if: steps.preloads.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src public.ecr.aws/docker/library/debian:bullseye bash -c '
            set -euo pipefail
            install_compilers() {
              apt-get -o Acquire::Check-Valid-Until=false update -qq &&
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc g++ gcc-multilib g++-multilib binutils >/dev/null
            }
            printf "deb http://deb.debian.org/debian bullseye main\ndeb http://security.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list
            if ! install_compilers; then
              printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list
              install_compilers
            fi
            tools/linuxfs/build-x86-preloads.sh app/src/main/assets/linuxfs
          '
          sudo chown -R "$(id -u):$(id -g)" app/src/main/assets/linuxfs
          ls -l app/src/main/assets/linuxfs/x86_64 app/src/main/assets/linuxfs/i386

      - name: Bundle the droiddeck-esync packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f tools/droiddeck-esync/release.env ]; then
            . tools/droiddeck-esync/release.env
            gh release download "$SYNC_BUNDLE_TAG" -R "$SYNC_BUNDLE_REPO" -p "$SYNC_BUNDLE_ASSET" -O sync-bundle.tzst
            echo "$SYNC_BUNDLE_SHA256  sync-bundle.tzst" | sha256sum -c -
            mkdir -p app/src/main/assets/droiddeck-esync
            tar --use-compress-program=unzstd -xf sync-bundle.tzst -C app/src/main/assets/droiddeck-esync
            rm sync-bundle.tzst
            gh release download "$SYNC_BUNDLE_TAG" -R "$SYNC_BUNDLE_REPO" -p index.json -O sync-index.json
            revoked=$(python3 -c 'import json, sys; print(" ".join(p["id"] for p in json.load(open(sys.argv[1]))["packs"] if p.get("revoked") is True))' sync-index.json)
            for id in $revoked; do
              if [ -e "app/src/main/assets/droiddeck-esync/packs/$id.tzst" ]; then
                echo "::warning::$SYNC_BUNDLE_ASSET carries revoked pack $id; it is left out of the APK (point tools/droiddeck-esync/release.env at a newer bundle)"
                rm -f "app/src/main/assets/droiddeck-esync/packs/$id.tzst"
              fi
            done
            rm sync-index.json
            test -f app/src/main/assets/droiddeck-esync/index.json
            test -f app/src/main/assets/droiddeck-esync/index.json.sig
            ls -lR app/src/main/assets/droiddeck-esync
          fi

      - name: Cache PulseAudio 13.0 source
        id: pa-src
        uses: actions/cache@v4
        with:
          path: pa13
          key: pulseaudio-src-13.0
      - name: Fetch PulseAudio 13.0 source
        if: steps.pa-src.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o pa.tar.gz https://github.com/pulseaudio/pulseaudio/archive/refs/tags/v13.0.tar.gz
          mkdir -p pa13 && tar -xzf pa.tar.gz -C pa13 --strip-components=1 && rm pa.tar.gz
      - name: Fetch DirectAudio (tools/directaudio/release.env)
        run: tools/directaudio/fetch.sh "$PWD" "$PWD/sink-out"
      - name: Build the AAudio sink into the audio bundle
        run: |
          set -euo pipefail
          export NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          tools/aaudio-sink/build.sh "$PWD/pa13" "$PWD/sink-out"
          rm -rf pa-bundle && mkdir -p pa-bundle
          tar --use-compress-program=unzstd -xf app/src/main/assets/pulseaudio.tzst -C pa-bundle
          test ! -f pa-bundle/modules/arm64/module-aaudio-sink.so
          install -m755 sink-out/module-aaudio-sink.so pa-bundle/modules/arm64/module-aaudio-sink.so
          install -m755 sink-out/module-directaudio-native-sink.so pa-bundle/modules/arm64/module-directaudio-native-sink.so
          (cd pa-bundle && tar --use-compress-program='zstd -19' -cf ../pulseaudio.tzst .)
          mkdir -p app/build/prepared-assets
          mv pulseaudio.tzst app/build/prepared-assets/pulseaudio.tzst
          tar --use-compress-program=unzstd -tf app/build/prepared-assets/pulseaudio.tzst | grep -c '\.so$'
          rm -rf pa-bundle sink-out
      - name: Cache proot
        id: proot
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libproot.so
            app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          key: proot-${{ env.NDK_VERSION }}-${{ hashFiles('tools/proot/**') }}
      - name: Build proot
        if: steps.proot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          tools/proot/build.sh app/src/main/jniLibs/arm64-v8a

      - name: Check the preloads
        run: |
          set -euo pipefail
          bash tools/linuxfs/check-preloads.sh app/src/main/assets/linuxfs

      - name: Check Quest tracking IPC
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          VK_INCLUDE=$(ls -d "$NDK"/toolchains/llvm/prebuilt/*/sysroot/usr/include | head -1)
          mkdir -p build/vr/include
          cp -R "$VK_INCLUDE/vulkan" build/vr/include/
          if [ -d "$VK_INCLUDE/vk_video" ]; then cp -R "$VK_INCLUDE/vk_video" build/vr/include/; fi
          g++ -std=c++17 -Wall -Wextra -Werror -pthread tools/vr/tests/test_xr_tracking.cpp -o /tmp/test-xr-tracking
          /tmp/test-xr-tracking
          g++ -std=c++17 -Wall -Wextra -Werror tools/vr/tests/test_xr_touch.cpp -o /tmp/test-xr-touch
          /tmp/test-xr-touch
          g++ -std=c++17 -Wall -Wextra -Werror -pthread tools/vr/tests/test_xr_vsync.cpp -o /tmp/test-xr-vsync
          /tmp/test-xr-vsync
          g++ -std=c++17 -Wall -Wextra -Werror -pthread tools/vr/tests/test_xr_frames.cpp -o /tmp/test-xr-frames
          /tmp/test-xr-frames
          cc -Itools/vr/third_party/wayland -c tools/vr/src/wayland_client_stub.c -o /tmp/test-wayland-stub.o
          cc -Itools/vr/third_party/wayland -c app/src/main/cpp/waylandcomp/generated/xdg-shell-protocol.c -o /tmp/test-xdg-shell.o
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-missing-field-initializers -pthread -Ibuild/vr/include \
            -Itools/vr/third_party/wayland -Iapp/src/main/cpp/waylandcomp/generated \
            tools/vr/tests/test_presenter_shutdown.cpp tools/vr/src/presenter.cpp /tmp/test-wayland-stub.o /tmp/test-xdg-shell.o \
            -ldl -o /tmp/test-presenter-shutdown
          timeout 10 /tmp/test-presenter-shutdown

      - name: Rust toolchain for the store engines (aarch64-linux-android)
        id: rust
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          echo "rustc=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          rustc -V; cargo -V

      - name: Cache cargo registry and the store engines' target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            app/src/main/rust/stores/target
          key: stores-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/rust/stores/Cargo.lock') }}
          restore-keys: |
            stores-${{ steps.rust.outputs.rustc }}-

      - name: cargo-ndk
        run: |
          set -euo pipefail
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Cache the CMake build tree
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: cxx-${{ env.NDK_VERSION }}-${{ hashFiles('app/src/main/cpp/**', 'tools/vr/src/xr_*.h') }}
          restore-keys: |
            cxx-${{ env.NDK_VERSION }}-

      - name: Build GOG Galaxy companion
        if: steps.preloads.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 aarch64-unknown-linux-gnu
          RUSTUP_TOOLCHAIN=1.90.0 bash tools/comet/build.sh

      - name: Build
        id: build
        env:
          DROIDDECK_BUILD_LABEL: ${{ steps.build-label.outputs.label }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: |
          set -o pipefail
          python3 tools/quest/build-driver.py "$ANDROID_HOME/ndk/$NDK_VERSION"
          python3 tools/release/runtime_inputs.py record
          ./gradlew assembleRelease --console=plain -PndkVersion="$NDK_VERSION" 2>&1 | tee /tmp/build.log
          python3 tools/release/check_session_assets.py app/build/outputs/apk/release/app-release.apk
          python3 tools/release/runtime_inputs.py apk app/build/outputs/apk/release/app-release.apk

      - name: Check the store engines' library
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          python3 tools/release/check_android_libraries.py app/build/outputs/apk/release/app-release.apk \
            --readelf "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          git diff --stat -- app/src/main/rust/stores/Cargo.lock
          git diff --exit-code -- app/src/main/rust/stores/Cargo.lock \
            || { echo "::error::Cargo.lock changed during the build; commit the regenerated lockfile (uploaded as stores-cargo-lock)"; exit 1; }

      - name: Store engines host unit tests
        timeout-minutes: 10
        continue-on-error: true
        run: |
          cd app/src/main/rust/stores
          cargo test --locked 2>&1 | tail -60

      - name: Upload the regenerated Cargo.lock
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stores-cargo-lock
          path: app/src/main/rust/stores/Cargo.lock
          if-no-files-found: ignore

      - name: Steam import and game environment tests
        run: |
          # The Xclipse layer regression test compiles the layer against the distribution's headers.
          sudo apt-get update -qq && sudo apt-get install -y -qq libvulkan-dev >/dev/null
          python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Unit tests
        id: unit-tests
        run: |
          set -o pipefail
          mkdir -p app/build
          ./gradlew testReleaseUnitTest --console=plain --info --stacktrace -Drobolectric.logging=stderr -PndkVersion="$NDK_VERSION" 2>&1 | tee app/build/unit-tests.log

      - name: Upload unit test diagnostics
        id: unit-test-diagnostics
        if: always() && steps.unit-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/unit-tests.log
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Sign with the testkey (v1 + v2 + v3)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/zipalign" -p -f 4 "$APK" "$APK.aligned"
          "$TOOLS/apksigner" sign \
            --ks keystore/testkey.p12 --ks-type PKCS12 --ks-pass pass:android \
            --ks-key-alias testkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned" "$APK.idsig"

      - name: Check the signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --min-sdk-version 21 --verbose --print-certs "$APK" | tee /tmp/sig.txt
          unzip -l "$APK" | grep -qE 'META-INF/.*\.(SF|RSA|DSA)$' \
            || { echo "::error::apk carries no JAR signature files"; exit 1; }
          for scheme in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" \
                        "v3 scheme (APK Signature Scheme v3): true"; do
            grep -qF "$scheme" /tmp/sig.txt || { echo "::error::apk is not signed with $scheme"; exit 1; }
          done
          grep -qi "CN=Android, OU=Android, O=Android" /tmp/sig.txt \
            || { echo "::error::apk is not signed with the AOSP testkey"; exit 1; }

      - uses: actions/upload-artifact@v4
        id: apk-upload
        with:
          name: droiddeck-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0


