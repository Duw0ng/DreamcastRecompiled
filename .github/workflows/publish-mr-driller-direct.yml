name: Publish Mr. Driller direct portable
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mr-driller-direct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Duw0ng/DreamcastRecompiled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify original Mr. Driller portable and publish independent release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="portable-mr-driller-direct-v1.2"
          asset="MR_DRILLER_portable_latest.zip"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Already published: $tag (will not overwrite)"
            exit 0
          fi
          gh release download Games-Portables --repo "$repo" --pattern "$asset" --dir . --clobber
          echo "af2e89c9a145462fbfdad017fc706ac927792359270b7a160a22587df60d57d9  $asset" | sha256sum --check -
          unzip -tq "$asset"
          for required in DreamcastRecompiled.exe bin/DreamcastRuntime.dll bin/dcr_game_module.dll bin/dreamcast_program.exe portable_manifest.txt; do
            unzip -Z1 "$asset" | grep -Fx "$required"
          done
          unzip -p "$asset" portable_manifest.txt | tr -d '\r' | grep -Fx 'GAME=MR_DRILLER'
          if unzip -Z1 "$asset" | grep -Eiq '\.(cdi|gdi|iso|chd|cue|nrg)$'; then
            echo 'Unexpected game disc image in portable; refusing publication' >&2
            exit 1
          fi
          sha256sum "$asset" > "$asset.sha256"
          cat > mr-driller-release-notes.md <<'NOTES'
          # Mr. Driller — Direct Portable V1.2 (Experimental)

          Windows x64 portable with game-specific precompiled native SH-4 module and runtime plugins.

          **Test status:** Mr. Driller gameplay was observed in previous maintainer tests, but significant graphics/rendering defects were present in menus, along with audio issues. This is an experimental tester, not a full-playability or stable-performance claim. This particular packaged ZIP has passed checksum and archive validation but has not been re-tested in Windows gameplay.

          Extract the ZIP and run `DreamcastRecompiled.exe`. You must provide your own compatible CDI/GDI image. The archive contains no disc image or firmware. Modules are title-specific and cannot be swapped between games.

          Report Windows version, CPU/GPU, game revision and diagnostic logs. Do not upload commercial game media.
          NOTES
          gh release create "$tag" "$asset" "$asset.sha256" \
            --repo "$repo" --target "$GITHUB_SHA" \
            --title "DreamcastRecompiled — Mr. Driller Direct Portable V1.2 (Experimental)" \
            --notes-file mr-driller-release-notes.md --latest=false
